services:
  # ========================================================
  # 1. ASP.NET CORE BACKEND API
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: digitlab-backend:latest
    container_name: digitlab-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=${DATABASE_PROVIDER:-SqlServer}
      - ConnectionStrings__DefaultConnection=${SQLSERVER_CONNECTION_STRING}
      - ConnectionStrings__SqliteConnection=${SQLITE_CONNECTION_STRING:-Data Source=/app/data/lab_lims.db}
      - Jwt__Key=${JWT_KEY:-DigitLabEnterpriseSuperSecretEncryptionKey2026!@#$%^&*}
      - Jwt__Issuer=${JWT_ISSUER:-DigitLab}
      - Jwt__Audience=${JWT_AUDIENCE:-DigitLabApp}
    volumes:
      - sqlite_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - digitlab-net

  # ========================================================
  # 2. ANGULAR FRONTEND + NGINX REVERSE PROXY
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: digitlab-frontend:latest
    container_name: digitlab-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "4200:80"
    depends_on:
      - backend
    networks:
      - digitlab-net

  # ========================================================
  # 3. OPTIONAL LOCAL SQL SERVER CONTAINER
  # Run with: docker compose --profile mssql up -d
  # ========================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: digitlab-mssql
    restart: unless-stopped
    profiles:
      - mssql
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-DigitLab@Sql2026!}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - digitlab-net

  # ========================================================
  # 4. WATCHTOWER (AUTO-UPDATE ON GITHUB COMMITS)
  # Run with: docker compose --profile auto up -d
  # ========================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: digitlab-watchtower
    restart: unless-stopped
    profiles:
      - auto
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock

networks:
  digitlab-net:
    driver: bridge

volumes:
  sqlite_data:
  mssql_data:
