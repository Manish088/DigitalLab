name: Build DigitLab Android APK

on:
  push:
    branches:
      - feature/mobile-app-signalr
      - main
    paths:
      - 'frontend/**'
      - 'mobile-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Platform 35 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Frontend Dependencies & Build Angular
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Prepare Mobile App Directory & Copy Assets
        run: |
          mkdir -p mobile-app/www
          cp -r frontend/dist/frontend/browser/* mobile-app/www/

      - name: Install Capacitor Dependencies in Mobile App
        working-directory: ./mobile-app
        run: |
          npm install
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./mobile-app/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || {
            echo "### ❌ Gradle Build Error Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 60 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare Named APK
        run: |
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk mobile-app/android/app/build/outputs/apk/debug/DigitLab.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitLab-Mobile-Debug-APK
          path: mobile-app/android/app/build/outputs/apk/debug/DigitLab.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/mobile-app-signalr' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-mobile
          name: DigitLab Mobile App Latest (Direct APK)
          body: |
            ### 📱 DigitLab Mobile App (Direct APK Download)
            Direct 1-tap download for Android mobile phone. No login or extraction required.
          files: mobile-app/android/app/build/outputs/apk/debug/DigitLab.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
