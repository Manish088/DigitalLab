name: Build DigitLab Android APK

on:
  push:
    branches:
      - feature/mobile-app-signalr
      - main
    paths:
      - 'frontend/**'
      - 'mobile-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Platform 35 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Frontend Dependencies & Build Angular
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Prepare Mobile App Directory & Copy Assets
        run: |
          mkdir -p mobile-app/www
          cp -r frontend/dist/frontend/browser/* mobile-app/www/

      - name: Install Capacitor Dependencies in Mobile App
        working-directory: ./mobile-app
        run: |
          npm install
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./mobile-app/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DigitLab.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitLab-Mobile-Debug-APK
          path: mobile-app/android/app/build/outputs/apk/debug/DigitLab.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0-mobile && gh release upload v1.0-mobile mobile-app/android/app/build/outputs/apk/debug/DigitLab.apk --clobber || gh release create v1.0-mobile mobile-app/android/app/build/outputs/apk/debug/DigitLab.apk --title "DigitLab Mobile App (Direct APK)" --notes "Direct 1-tap download for Android mobile phone. No login or extraction required."
